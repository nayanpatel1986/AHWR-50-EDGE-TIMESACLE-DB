# Telegraf liveness endpoint (agent and output pipeline alive -> HTTP 200).
# Loaded from telegraf.d alongside the backend-managed plc.conf.
#
# This is pipeline LIVENESS, not data freshness: whether PLC tags are still
# updating is scored by the backend (GET /api/health/edge).
[[outputs.health]]
  service_address = "tcp://${TELEGRAF_HEALTH_ADDRESS:-127.0.0.1:8888}"
  read_timeout = "5s"
  write_timeout = "5s"
