# =============================================================================
# AHWR-150 EDGE — Telegraf base configuration (TimescaleDB historian)
#
#   telegraf --config telegraf.conf --config-directory telegraf.d --watch-config poll
#
#   telegraf.conf                    agent, BOP listener, heartbeat, historian output (this file)
#   telegraf.d/plc.conf              PLC inputs, rig_id tag, telemetry mapping  (MANAGED BY THE BACKEND)
#   telegraf.d/ahwr-telemetry.star   generated PLC tag -> metric map used by plc.conf
#   telegraf.d/health.conf           liveness endpoint on 127.0.0.1:8888
#
# RIG PLC ACCESS: READ-ONLY COLLECTION
# The s7comm/modbus inputs in plc.conf only read configured addresses. CMD/
# Start/Stop-named tags are read-back observations, not commands. The only
# output writes to the local historian database, never to a PLC. This note
# documents plugin behaviour; it is not a PLC or network access-control rule.
# =============================================================================

[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 1000
  ## Held in memory while the database is unavailable, then written in order.
  metric_buffer_limit = 100000
  collection_jitter = "0s"
  flush_interval = "1s"
  flush_jitter = "0s"
  precision = ""
  omit_hostname = true

# Heartbeat input: keeps Telegraf running before any PLC is mapped. Its
# internal_* metrics are not written to the historian.
[[inputs.internal]]
  collect_memstats = false

# Local write endpoint for the VersaMax / KEPServerEX BOP collector
# (app/collector.py). InfluxDB v2 line protocol in; the same telemetry mapping
# as PLC data out. Loopback only — never expose this port.
[[inputs.influxdb_v2_listener]]
  service_address = "${TELEGRAF_LISTENER_ADDRESS:-127.0.0.1:8186}"

# Historian: TimescaleDB, the CMF canonical telemetry table
# (ts, rig_id, metric, value), created by app/sql/02-schema.sql. Telegraf only
# inserts: it never creates or alters tables (telegraf_writer has INSERT only).
[[outputs.postgresql]]
  namepass = ["telemetry"]
  connection = "host=${PGHOST:-127.0.0.1} port=${PGPORT:-5432} dbname=${PGDATABASE:-ahwr_edge} user=telegraf_writer password=${TELEGRAF_DB_PASSWORD} sslmode=disable"
  schema = "public"
  tags_as_foreign_keys = false
  tags_as_jsonb = false
  fields_as_jsonb = false
  timestamp_column_name = "ts"
  timestamp_column_type = "timestamp with time zone"
  create_templates = []
  add_column_templates = []
